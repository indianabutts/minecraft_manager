<c-side-panel title="Active Tasks">
  <c-slot name="body">
    <div class="space-y-3">
      {% for task in tasks %}
      <div class="flex items-center space-x-3 p-3 bg-black bg-opacity-20 rounded">
        <input type="checkbox" class="w-4 h-4">
        <div class="flex-1">
          <p class="text-sm font-semibold">{{task.name}}</p>
          <p class="text-xs text-gray-400">{{task.project.world.name}}</p>
        </div>
	{% if task.private == True %}
        <span class="text-sm" title="Private">🔒</span>
	{% else %}
        <span class="text-sm" title="Shared">🌐</span>
	{% endif %}
      </div>
      {% endfor %}
  </c-slot>
</c-side-panel>
