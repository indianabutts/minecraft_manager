<div class="world-card p-6 rounded-lg simple-shadow">
  <div class="flex justify-between items-start mb-4">
    <div>
      <h3 class="text-xl font-bold mb-1" style="color: var(--diamond-blue);">{{ name }}</h3>
      <p class="text-sm text-gray-400">{{ game_mode }} • Seed: {{ seed }}</p>
    </div>
    {% if status == "True"  %}
    <span class="project-badge" style="background: var(--grass-green); color: white;"> Active </span>
    {% else %}
    <span class="project-badge" style="background: var(--stone-gray); color: white;">Inactive</span>
    {% endif %}
  </div>
  
  <div class="grid grid-cols-3 gap-3 mb-4">
    <c-worlds.stat name="Projects" value="{{world.projects.all.count}}" color="var(--gold-yellow)"/>
    <c-worlds.stat name="Coordinates" value="{{world.coordinates.all.count}}" color="var(--diamond-blue)"/>
    <c-worlds.stat name="Members" value="4" color="var(--grass-green)"/>
  </div>


  <div class="flex items-center space-x-4">
    <button class="flex-1 py-2 simple-btn rounded text-xs" style="background: var(--diamond-blue); color: white;">
      Open World
    </button>
    <button class="px-4 py-2 bg-gray-700 bg-opacity-50 hover:bg-opacity-70 transition-colors text-xs rounded">
      ⚙️
    </button>
  </div>
</div>
